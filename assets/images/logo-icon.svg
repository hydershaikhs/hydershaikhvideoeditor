<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="maroonIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#580F1B"/>
      <stop offset="50%" stop-color="#8A1432"/>
      <stop offset="100%" stop-color="#C51B47"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#580F1B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="84" height="84" rx="26" fill="url(#maroonIconGrad)" filter="url(#iconShadow)"/>
  <rect x="8" y="8" width="84" height="84" rx="26" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Perforations -->
  <circle cx="24" cy="20" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="40" cy="20" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="60" cy="20" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="76" cy="20" r="3" fill="#FFFFFF" fill-opacity="0.7"/>

  <circle cx="24" cy="80" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="40" cy="80" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="60" cy="80" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="76" cy="80" r="3" fill="#FFFFFF" fill-opacity="0.7"/>

  <!-- Monogram HS with Play Action -->
  <path d="M30 33V67" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M30 50H46" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Right Play Triangle -->
  <polygon points="48,36 74,50 48,64" fill="#FFFFFF"/>
  <polygon points="51,41 68,50 51,59" fill="url(#maroonIconGrad)"/>
  <circle cx="57" cy="50" r="2.5" fill="#FFFFFF"/>
</svg>
